<style>
/* Layout: sticky search bar on top, single readable column of event blocks below, grouped by chaos */
:root {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --fg: #16181d;
  --muted: #5d6472;
  --line: #d9dde4;
  --accent: #0b6e78;
  --accent-soft: #dff1f2;
  --rare: #f6dc8a;
  --rare-fg: #5a4300;
  --mark: #ffe066;
  --mark-fg: #16181d;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --surface: #1a1d23; --fg: #e8eaee; --muted: #9aa1ad; --line: #2c313a;
    --accent: #4fc3cc; --accent-soft: #163338; --rare: #6b5617; --rare-fg: #ffe9a8;
    --mark: #b8901a; --mark-fg: #ffffff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --surface: #1a1d23; --fg: #e8eaee; --muted: #9aa1ad; --line: #2c313a;
  --accent: #4fc3cc; --accent-soft: #163338; --rare: #6b5617; --rare-fg: #ffe9a8;
  --mark: #b8901a; --mark-fg: #ffffff; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body);
  font-size: 15px; line-height: 1.6;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--surface);
}
.wrap {
  max-width: 920px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
header.bar .wrap { padding-block: 14px 12px; display: grid; gap: 10px; }

details {
  border: 1px solid #ccc;
  border-radius: 4px;
  padding: 10px;
}
summary {
  cursor: pointer; /* マウスを乗せたときに指マークにする */
  font-weight: bold;
}

h1 {
  font-family: var(--font-display); font-weight: 400; font-size: 22px; margin: 0;
  letter-spacing: 0.02em; text-wrap: balance;
}
h1 small { font-family: var(--font-body); font-size: 13px; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.search { display: flex; gap: 8px; flex-wrap: wrap; }
.search input[type="search"] {
  flex: 1 1 260px; min-width: 0; font: inherit; font-size: 16px;
  padding: 10px 14px; border: 2px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--fg);
}
.search input[type="search"]:focus { outline: none; border-color: var(--accent); }
.search select {
  font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--fg);
}
.opts { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; color: var(--muted); }
.opts label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: inherit; font-size: 13px; padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer;
}
.chip:hover, .chip:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.count strong { color: var(--fg); }

main .wrap { padding-block: 16px 48px; display: grid; gap: 28px; }
.chaos h2 {
  font-family: var(--font-display); font-weight: 400; font-size: 20px; margin: 0 0 10px;
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
}
.chaos h2 .n { font-family: var(--font-body); font-size: 13px; color: var(--muted); }
.events { display: grid; gap: 10px; }
.ev {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  display: grid; grid-template-columns: 64px minmax(0, 1fr); overflow: hidden;
}
.ev .side {
  border-right: 2px solid var(--fg); display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; writing-mode: vertical-rl; letter-spacing: 0.15em;
  padding: 8px 0; color: var(--muted);
}
.ev.rare .side { background: var(--rare); color: var(--rare-fg); }
.ev .body { min-width: 0; }
.ev .head {
  display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap;
  padding: 8px 14px; border-bottom: 2px solid var(--fg);
}
.ev .title { font-weight: 700; font-size: 16px; }
.tag {
  font-size: 12px; padding: 0 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent);
  white-space: nowrap;
}
.rows { list-style: none; margin: 0; padding: 0; }
.rows li {
  display: grid; grid-template-columns: 40px minmax(0, 1fr); border-top: 1px solid var(--line);
}
.rows li:first-child { border-top: 0; }
.rows .lab {
  border-right: 2px solid var(--fg); padding: 5px 6px; font-variant-numeric: tabular-nums;
  color: var(--muted); font-size: 13px;
}
.rows .l1 .lab { text-align: left; color: var(--fg); font-weight: 700; }
.rows .l2 .lab { text-align: center; }
.rows .l3 .lab, .rows .l4 .lab, .rows .l5 .lab, .rows .l6 .lab { text-align: right; }
.rows .txt { padding: 5px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.rows .l2 .txt { padding-left: 24px; }
.rows .l3 .txt { padding-left: 36px; }
.rows .l4 .txt, .rows .l5 .txt, .rows .l6 .txt { padding-left: 48px; }
.rows .note .txt { color: var(--muted); font-size: 13px; }
.rows li.hit { background: var(--accent-soft); }
.fn { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.fn::before { content: "脚注："; }
mark { background: var(--mark); color: var(--mark-fg); border-radius: 2px; padding: 0 1px; }
.empty {
  background: var(--surface); border: 1px dashed var(--line); border-radius: 6px;
  padding: 28px 20px; text-align: center; color: var(--muted);
}
.more { text-align: center; }
.more button {
  font: inherit; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--accent);
  background: var(--surface); color: var(--accent); cursor: pointer;
}
.more button:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
footer { color: var(--muted); font-size: 12px; }
footer a { color: var(--accent); }
@media (max-width: 520px) {
  .ev { grid-template-columns: 34px minmax(0, 1fr); }
  .ev .side { font-size: 12px; letter-spacing: 0.05em; }
  .rows li { grid-template-columns: 30px minmax(0, 1fr); }
  .rows .l2 .txt { padding-left: 14px; }
  .rows .l3 .txt { padding-left: 22px; }
  .rows .l4 .txt, .rows .l5 .txt, .rows .l6 .txt { padding-left: 28px; }
  h1 { font-size: 19px; }
}
</style>

  </details>
    <div class="count" id="count" aria-live="polite"></div>
  </div>
</header>

<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const PAGE_SIZE = 60;
  const STORAGE_KEY = "chaos-event-search";

  const $ = (id) => document.getElementById(id);
  const qEl = $("q"), chaosEl = $("chaos"), areaEl = $("area"), rareEl = $("rareOnly"),
        titleEl = $("titleOnly"), resultsEl = $("results"), countEl = $("count");

  // Normalize one char: NFKC, lowercase, katakana -> hiragana, unify long dash/tilde variants.
  function normChar(c) {
    let s = c.normalize("NFKC").toLowerCase();
    s = s.replace(/[ァ-ヶ]/g, (k) => String.fromCharCode(k.charCodeAt(0) - 0x60));
    s = s.replace(/[〜～~]/g, "~").replace(/[ー－−‐]/g, "ー");
    return s;
  }
  function norm(str) { let o = ""; for (const c of str) o += normChar(c); return o; }

  // Build per-event searchable records once.
  const events = [];
  DATA.forEach((c) => c.events.forEach((e) => {
    const rows = e.rows.map((r) => ({ ...r, n: norm(r.text + " " + (r.notes || []).join(" ")) }));
    events.push({ chaos: c.chaos, ...e, rows, nTitle: norm(e.title), nArea: norm(e.area || "") });
  }));

  DATA.forEach((c) => chaosEl.add(new Option(c.chaos, c.chaos)));
  [...new Set(events.map((e) => e.baseArea))].sort().forEach((a) => areaEl.add(new Option(a, a)));

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // Highlight terms in original text by matching on per-char normalized form.
  function highlight(text, terms) {
    if (!terms.length) return escapeHtml(text);
    const chars = [...text];
    let nStr = ""; const map = [];
    chars.forEach((c, i) => { const n = normChar(c); for (let k = 0; k < n.length; k++) map.push(i); nStr += n; });
    const on = new Array(chars.length).fill(false);
    terms.forEach((t) => {
      let from = 0, idx;
      while (t && (idx = nStr.indexOf(t, from)) !== -1) {
        for (let k = idx; k < idx + t.length; k++) on[map[k]] = true;
        from = idx + t.length;
      }
    });
    let out = "", open = false;
    chars.forEach((c, i) => {
      if (on[i] && !open) { out += "<mark>"; open = true; }
      if (!on[i] && open) { out += "</mark>"; open = false; }
      out += escapeHtml(c);
    });
    return open ? out + "</mark>" : out;
  }

  let limit = PAGE_SIZE;

  function currentState() {
    return { q: qEl.value, chaos: chaosEl.value, area: areaEl.value, rare: rareEl.checked, title: titleEl.checked };
  }

  function filter() {
    const st = currentState();
    const terms = norm(st.q).split(/\s+/).filter(Boolean);
    const out = [];
    for (const e of events) {
      if (st.chaos && e.chaos !== st.chaos) continue;
      if (st.area && e.baseArea !== st.area) continue;
      if (st.rare && !e.rare) continue;
      const hay = st.title ? e.nTitle : e.nTitle + "\n" + e.nArea + "\n" + e.rows.map((r) => r.n).join("\n");
      if (!terms.every((t) => hay.includes(t))) continue;
      out.push(e);
    }
    return { list: out, terms, st };
  }

  function renderEvent(e, terms, titleOnly) {
    const rows = e.rows.map((r) => {
      const hit = !titleOnly && terms.length && terms.some((t) => r.n.includes(t));
      const cls = (r.kind === "note" ? "note " : "l" + r.level + " ") + (hit ? "hit" : "");
      const fns = (r.notes || []).map((n) => `<span class="fn">${highlight(n, titleOnly ? [] : terms)}</span>`).join("");
      return `<li class="${cls}"><span class="lab">${escapeHtml(r.label || "")}</span>` +
             `<span class="txt">${highlight(r.text, titleOnly ? [] : terms)}${fns}</span></li>`;
    }).join("");
    const url = "https://nightmare.aosns.com/カオス一覧/" + encodeURIComponent(e.chaos);
    return `<article class="ev${e.rare ? " rare" : ""}">` +
      `<div class="side">${e.rare ? "希少" : ""}</div>` +
      `<div class="body"><div class="head"><span class="title">${highlight(e.title, terms)}</span>` +
      `<span class="tag">発生：${escapeHtml(e.area || "記載なし")}</span>` +
      `<a class="tag" href="${url}" target="_blank" rel="noopener">wiki</a></div>` +
      `<ul class="rows">${rows}</ul></div></article>`;
  }

  function render() {
    const { list, terms, st } = filter();
    const shown = list.slice(0, limit);
    const total = events.length;
    countEl.innerHTML = terms.length || st.chaos || st.area || st.rare
      ? `<strong>${list.length}</strong> 件ヒット（全 ${total} イベント中）`
      : `全 <strong>${total}</strong> イベントを表示中。検索ワードを入れると、その文字を含むイベントだけに絞り込みます。`;

    if (!list.length) {
      resultsEl.innerHTML = `<div class="empty">「${escapeHtml(st.q)}」を含むイベントは見つかりませんでした。<br>言葉を短くするか、絞り込み条件を外してみてください。</div>`;
      return;
    }
    const groups = new Map();
    shown.forEach((e) => { if (!groups.has(e.chaos)) groups.set(e.chaos, []); groups.get(e.chaos).push(e); });
    const counts = new Map();
    list.forEach((e) => counts.set(e.chaos, (counts.get(e.chaos) || 0) + 1));
    let html = "";
    groups.forEach((evs, chaos) => {
      html += `<section class="chaos"><h2>${escapeHtml(chaos)}<span class="n">${counts.get(chaos)} 件</span></h2>` +
              `<div class="events">${evs.map((e) => renderEvent(e, terms, st.title)).join("")}</div></section>`;
    });
    if (list.length > shown.length) {
      html += `<div class="more"><button type="button" id="more">さらに表示（残り ${list.length - shown.length} 件）</button></div>`;
    }
    resultsEl.innerHTML = html;
    const more = $("more");
    if (more) more.addEventListener("click", () => { limit += PAGE_SIZE * 2; render(); });
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(currentState())); } catch (err) { /* storage unavailable: keep working without it */ }
  }
  function restore() {
    try {
      const st = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      if (!st) return;
      qEl.value = st.q || ""; chaosEl.value = st.chaos || ""; areaEl.value = st.area || "";
      rareEl.checked = !!st.rare; titleEl.checked = !!st.title;
    } catch (err) { /* ignore broken or blocked storage */ }
  }

  let timer = null;
  function update() { limit = PAGE_SIZE; render(); save(); }
  qEl.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(update, 120); });
  [chaosEl, areaEl, rareEl, titleEl].forEach((el) => el.addEventListener("change", update));
  document.querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => {
    qEl.value = b.textContent; update(); qEl.focus();
  }));

  restore();
  render();
})();
</script>

</body></html>
